version: 2
updates:
  # One grouped PR per ecosystem: separate PRs each rewrite pnpm-lock.yaml and corrupt it when merged in a row.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      all-npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      all-actions: { patterns: ["*"] }
